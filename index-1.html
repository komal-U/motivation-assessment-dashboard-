onsistent action sustain progress.</footer>
</main>
<script>
(function(){
const members=[["Vishwas","PL"],["Manjeet","Fellow"],["Chakrdhar","Fellow"],["Rajdeep","Fellow"],["Dinesh","Fellow"],["Shivam","Fellow"],["Ekta","Fellow"],["Probali","Fellow"],["Komal","Fellow"]];
const cats=[["start","Goal/Task to START","Begin a useful action"],["stop","Goal/Task to STOP","Reduce an unhelpful habit"],["complete","Goal/Task to COMPLETE","Finish an important task"]];
const $=id=>document.getElementById(id);
const member=$("member");
members.forEach(([name,role])=>{let o=document.createElement("option");o.value=name;o.textContent=name+" — "+role;member.appendChild(o)});
let active="Vishwas", saved={};
try{saved=JSON.parse(localStorage.getItem("motivationAssessmentGroup")||"{}")}catch(e){saved={}}
function buildGoals(){const root=$("goals");root.innerHTML="";cats.forEach(([key,title,sub])=>{const box=document.createElement("div");box.className="assessment-card";box.innerHTML=`<h3>${title}</h3><p>${sub} · 5 entries</p>`;for(let i=0;i<5;i++){let wrap=document.createElement("div");wrap.style.margin="9px 0";wrap.innerHTML=`<label for="${key}${i}">${i+1}. Goal / task</label><input id="${key}${i}" data-cat="${key}" data-index="${i}" placeholder="${["Example: wake up early","Example: reduce distractions","Example: finish a course"][cats.findIndex(c=>c[0]===key)]}">`;box.appendChild(wrap)}root.appendChild(box)})}
function readForm(){const goals={start:[],stop:[],complete:[]};document.querySelectorAll("[data-cat]").forEach(el=>goals[el.dataset.cat][+el.dataset.index]=el.value.trim());return {member:active,role:members.find(m=>m[0]===active)[1],date:$("date").value,motivation:+$("motivation").value,reflection:$("reflection").value,goals,mainGoal:$("mainGoal").value,why:$("why").value,barrier:$("barrier").value,firstStep:$("firstStep").value,support:$("support").value,review:$("review").value,updatedAt:new Date().toISOString()}}
function fillForm(d){d=d||{};$("role").value=d.role||members.find(m=>m[0]===active)[1];$("date").value=d.date||new Date().toISOString().slice(0,10);$("motivation").value=d.motivation||3;$("reflection").value=d.reflection||"";cats.forEach(([k])=>{for(let i=0;i<5;i++){let el=$(k+i);if(el)el.value=(d.goals&&d.goals[k]&&d.goals[k][i])||""}});["mainGoal","why","barrier","firstStep","support","review"].forEach(k=>$(k).value=d[k]||"");render()}
function render(){const d=readForm();let counts={start:d.goals.start.filter(Boolean).length,stop:d.goals.stop.filter(Boolean).length,complete:d.goals.complete.filter(Boolean).length};$("startCount").textContent=counts.start;$("stopCount").textContent=counts.stop;$("completeCount").textContent=counts.complete;
const savedCount=Object.keys(saved).length;const mscore=d.motivation;$("snapshot").className="";$("snapshot").innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><strong style="font-size:20px">${active}</strong><span class="pill">${d.role}</span></div><p class="small">Motivation rating</p><div style="font-size:25px;color:var(--blue);font-weight:800">${mscore}/5</div><div class="track"><div class="fill" style="width:${mscore*20}%"></div></div><p>${d.mainGoal?`<strong>Priority:</strong> ${escapeHtml(d.mainGoal)}`:"No priority goal entered yet."}</p><p class="small">${d.reflection?escapeHtml(d.reflection):"Add a short reflection to make this assessment meaningful."}</p>`;
const filled=Object.keys(saved).length;const bars=[["Assessments saved",filled,9],["Group not yet saved",9-filled,9]];$("overview").innerHTML=bars.map(([label,val,max])=>`<div class="barrow"><div class="barlabel"><span>${label}</span><strong>${val}/${max}</strong></div><div class="track"><div class="fill" style="width:${Math.min(100,val/max*100)}%"></div></div></div>`).join("");
const all=Object.values(saved);let total={start:0,stop:0,complete:0};all.forEach(a=>cats.forEach(([k])=>total[k]+=(a.goals?.[k]||[]).filter(Boolean).length));$("insights").className="";$("insights").innerHTML=`<p><strong>Saved group reflections:</strong> ${filled} of 9</p><p><strong>Shared goal themes captured:</strong> ${total.start} start · ${total.stop} stop · ${total.complete} complete entries across saved assessments.</p><p><strong>Reflection prompt:</strong> What is one small step each person can take this week, and how will the group support accountability without judgement?</p><p class="small">These are descriptive counts, not a ranking of people. Motivation ratings are self-reported.</p>`;
$("status").textContent=saved[active]?"Saved locally · Last saved: "+new Date(saved[active].updatedAt||Date.now()).toLocaleString():"This member has not been saved on this device.";renderChips()}
function renderChips(){/* member selector is the main navigation */}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function download(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function save(){const d=readForm();saved[active]=d;localStorage.setItem("motivationAssessmentGroup",JSON.stringify(saved));render();$("status").textContent="Saved on this device. Export JSON to share with the group."}
member.addEventListener("change",()=>{active=member.value;fillForm(saved[active]||{})});
$("save").addEventListener("click",save);
$("exportOne").addEventListener("click",()=>download(readForm(),"motivation-"+active.toLowerCase()+".json"));
$("exportAll").addEventListener("click",()=>download({project:"Motivation & Goal Assessment",members:saved,exportedAt:new Date().toISOString()},"motivation-group-assessments.json"));
$("print").addEventListener("click",()=>window.print());
$("clearMember").addEventListener("click",()=>{if(confirm("Clear this member's saved assessment from this device?")){delete saved[active];localStorage.setItem("motivationAssessmentGroup",JSON.stringify(saved));fillForm({});}});
$("importFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.members){Object.assign(saved,data.members)}else if(data.member){saved[data.member]=data}localStorage.setItem("motivationAssessmentGroup",JSON.stringify(saved));if(saved[active])fillForm(saved[active]);else render();$("status").textContent="Import complete. Saved assessments loaded on this device."}catch(err){$("status").textContent="Could not import file. Please choose a valid exported JSON file."}e.target.value=""});
document.querySelectorAll("input,textarea,select").forEach(el=>{if(!["member","importFile"].includes(el.id))el.addEventListener("input",render)});
buildGoals();active=member.value;fillForm(saved[active]||{});
})();
</script>
</body>
</html>
